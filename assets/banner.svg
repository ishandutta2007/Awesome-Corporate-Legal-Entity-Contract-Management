<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="violetPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="emeraldPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="amberPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowOrb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.25" />
    </pattern>

    <!-- Dynamic Styles / Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.12); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .orb-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 8s ease-in-out infinite;
      }
      .orb-2 {
        transform-origin: 1000px 300px;
        animation: pulseGlow 10s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: dashMove 3s linear infinite;
      }
      .float-group-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .float-group-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Tech Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambience (Strictly in Background) -->
  <circle class="orb-1" cx="180" cy="90" r="140" fill="#3b82f6" opacity="0.35" filter="url(#glowOrb)" />
  <circle class="orb-2" cx="1020" cy="330" r="160" fill="#8b5cf6" opacity="0.35" filter="url(#glowOrb)" />
  <circle cx="600" cy="210" r="120" fill="#06b6d4" opacity="0.15" filter="url(#glowOrb)" />

  <!-- Geometric Grid Matrix -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Circuit / Legal-Contract Entity Data Flow Lines (Background) -->
  <g opacity="0.4">
    <path class="flow-line" d="M 50 120 Q 300 40 600 120 T 1150 120" fill="none" stroke="#60a5fa" stroke-width="1.5" />
    <path class="flow-line" d="M 50 320 Q 300 400 600 320 T 1150 320" fill="none" stroke="#a78bfa" stroke-width="1.5" />
    <line x1="220" y1="120" x2="220" y2="320" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="980" y1="120" x2="980" y2="320" stroke="#c084fc" stroke-width="1" stroke-dasharray="4,4" />
  </g>

  <!-- Animated Subtle Background Governance Nodes -->
  <g class="float-group-1" opacity="0.65">
    <circle cx="120" cy="120" r="8" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="120" cy="120" r="3" fill="#ffffff" />
    <text x="135" y="124" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">HOLDING CO</text>

    <circle cx="1060" cy="110" r="8" fill="#a855f7" filter="url(#glow)" />
    <circle cx="1060" cy="110" r="3" fill="#ffffff" />
    <text x="965" y="114" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">SMART CLM</text>
  </g>

  <g class="float-group-2" opacity="0.65">
    <circle cx="140" cy="310" r="8" fill="#10b981" filter="url(#glow)" />
    <circle cx="140" cy="310" r="3" fill="#ffffff" />
    <text x="155" y="314" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">SUBSIDIARY</text>

    <circle cx="1040" cy="320" r="8" fill="#f43f5e" filter="url(#glow)" />
    <circle cx="1040" cy="320" r="3" fill="#ffffff" />
    <text x="945" y="324" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">UBO / AUDIT</text>
  </g>

  <!-- FOREGROUND: Header Brand & Typography (Clean, Crisp, High Contrast) -->
  <g id="brand-header">
    <!-- Top Pill Badge -->
    <g transform="translate(460, 42)">
      <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="15" r="5" fill="#10b981" />
      <text x="32" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">ENTERPRISE LEGALTECH ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="135" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="35" font-weight="900" letter-spacing="-0.5">
      Corporate Legal Entity &amp; Contract Management
    </text>

    <!-- Secondary Subtitle -->
    <text x="600" y="180" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0.2">
      Curated Landscape of Commercial SaaS Platforms &amp; Open-Source Projects
    </text>

    <!-- Descriptive Subtext -->
    <text x="600" y="215" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">
      Multi-Jurisdictional Subsidiary Governance • UBO Registries • Obligation Tracking • CLM Automation
    </text>
  </g>

  <!-- FOREGROUND: Interactive Feature Badges / Category Pillars -->
  <g id="feature-pills" transform="translate(180, 260)">
    <!-- Pill 1: Legal Entity Management -->
    <g transform="translate(0, 0)">
      <rect width="190" height="40" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" opacity="0.9" />
      <text x="95" y="25" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🏛️ Entity Governance</text>
    </g>

    <!-- Pill 2: Contract Lifecycle Management -->
    <g transform="translate(210, 0)">
      <rect width="190" height="40" rx="10" fill="#0f172a" stroke="#9333ea" stroke-width="1.5" opacity="0.9" />
      <text x="95" y="25" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">📜 Contract Lifecycle</text>
    </g>

    <!-- Pill 3: Obligation & Compliance -->
    <g transform="translate(420, 0)">
      <rect width="200" height="40" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5" opacity="0.9" />
      <text x="100" y="25" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚖️ Compliance &amp; Audit</text>
    </g>

    <!-- Pill 4: Open Source & Self-Hosted -->
    <g transform="translate(640, 0)">
      <rect width="200" height="40" rx="10" fill="#0f172a" stroke="#ea580c" stroke-width="1.5" opacity="0.9" />
      <text x="100" y="25" text-anchor="middle" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">💻 Open-Source &amp; Self-Hosted</text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(0, 395)">
    <rect width="1200" height="25" fill="#0b0f19" opacity="0.8" />
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#334155" stroke-width="1" />
    <text x="600" y="17" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
      ⚡ AI-Native Extraction • Hash-Chained Audit Logs • Jurisdiction Registrations • CAP Table &amp; UBO
    </text>
  </g>
</svg>
